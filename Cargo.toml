[workspace]
members = ["crates/taskforge-execution", "crates/judge-local"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
repository = "https://github.com/ermijeremy/TaskForge"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
rustix = { version = "1.1.5", features = ["fs"] }
taskforge-execution = { path = "crates/taskforge-execution" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
